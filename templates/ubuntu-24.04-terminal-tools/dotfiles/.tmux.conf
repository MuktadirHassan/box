# Friendly defaults
set -g prefix C-a
unbind C-b
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 100000
set -g mouse on
set -g mode-keys vi
set -g status-keys vi
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB,tmux-256color:RGB"
set -sg escape-time 10
set -g focus-events on
set -g renumber-windows on

# Noctalia-inspired status bar
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#131318,fg=#e4e1e9"
set -g status-left '#[bg=#bdc2ff,fg=#262b61,bold] #S #[default]'
set -g status-right '#[fg=#c7c5d0]%Y-%m-%d %H:%M #[fg=#91909a] #(hostname)'
set -g message-style "bg=#1f1f25,fg=#bdc2ff"
set -g pane-border-style "fg=#46464f"
set -g pane-active-border-style "fg=#bdc2ff"

# Easier pane navigation and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config quickly
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Better copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Keep long-lived sessions alive across reconnects and avoid nested warnings
set -g set-clipboard on
set -g detach-on-destroy off