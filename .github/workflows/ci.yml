name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config xvfb
      - run: go test -tags webkit2_41 ./...
      - run: go vet -tags webkit2_41 ./...
      - run: go build -tags webkit2_41 ./...
      - name: Smoke test desktop binary
        run: |
          go build -tags webkit2_41 -o "$RUNNER_TEMP/box-desktop" ./desktop
          timeout --signal=KILL 20s xvfb-run -a bash -ceu '
            "$1" &
            pid=$!
            trap "kill -TERM $pid 2>/dev/null || true; wait $pid 2>/dev/null || true" EXIT
            sleep 5
            kill -0 "$pid"
            kill -TERM "$pid"
            if wait "$pid"; then
              exit 0
            else
              status=$?
              test "$status" -eq 143
            fi
          ' bash "$RUNNER_TEMP/box-desktop"

  desktop-packages:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install desktop packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - uses: actions/upload-artifact@v4
        with:
          name: box-desktop-native-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
      - name: Run end-to-end tests
        run: scripts/e2e.sh
