name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  e2e:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config xvfb
      - name: Run unit tests
        run: go test -tags webkit2_41 ./...
      - name: Run static analysis
        run: go vet -tags webkit2_41 ./...
      - name: Build packages
        run: go build -tags webkit2_41 ./...
      - name: Smoke test desktop binary
        run: |
          go build -tags webkit2_41 -o "$RUNNER_TEMP/box-desktop" ./desktop
          timeout --signal=KILL 20s xvfb-run -a bash -ceu '
            "$1" &
            pid=$!
            trap "kill -TERM $pid 2>/dev/null || true; wait $pid 2>/dev/null || true" EXIT
            sleep 5
            kill -0 "$pid"
            kill -TERM "$pid"
            if wait "$pid"; then
              exit 0
            else
              status=$?
              test "$status" -eq 143
            fi
          ' bash "$RUNNER_TEMP/box-desktop"
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
      - name: Run end-to-end tests
        run: scripts/e2e.sh

  build-release:
    needs:
      - release-please
      - e2e
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install desktop packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup-staging-release:
    needs:
      - release-please
      - e2e
      - build-release
    if: ${{ always() && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Remove staging drafts
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r --arg tag "$TAG_NAME" '.[] | select(.draft and .tag_name == $tag) | .id' |
            while read -r release_id; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
            done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
